<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale = 1.0">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

        <script src="JavaScript/slider.js" defer></script>


        <style>
            body {
                background-color: slategrey;
                overflow-x: hidden;
            }

            h1 {
                font-size: 5em;
                color: black;
                text-align: center;
            }

            button{
                width: 20%;
                height: 100%;
                border-radius: 30px;
                background-color: black;
                color: white;
            }
            button:hover{
                background-color: white;
                color: #1b1b1b;
                transform: scale(1.3);
                transition: all 0.7s ease;
            }
            button.active{
                background-color: white;
                color: black;
                transform: scale(1.2);
                transition: all 0.7s ease;
            }

            #readMoreButtons{
                height: 20vh;
                width: 100vw;
                display: flex;
                justify-content: space-around;
                position: relative;
                flex-direction: row;
            }
            #contentContainer{
                margin-top: 5vw;
                width: 70vw;
                height: 50vh;
                background-color: white;
                color: black;
                margin-left: auto;
                margin-right: auto;
                opacity: 0;
                transition: opacity 0.5s ease;
            }
            #contentToChange{
                font-size: 20px;
                text-align: center;
                padding-top: 20px;
                font-weight: bold;
            }

            .swiper {
            width: 100%;
            padding-top: 80px;
            padding-bottom: 80px;
            }

            .swiper-slide {
            width: 420px;
            height: 420px;

            border-radius: 24px;

            background-color: black;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 4rem;

            transition: transform 0.4s ease;
            }

            .swiper-wrapper {
            transition-timing-function: linear !important;
            }

        </style>

    </head>
    <body>

        <h1>Hello World!</h1>

        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">Slide 1</div>
                <div class="swiper-slide">Slide 2</div>
                <div class="swiper-slide">Slide 3</div>
                <div class="swiper-slide">Slide 4</div>
            </div>
        </div>

        <div id="readMoreButtons">
            <button onclick="OpenContent('content box 1 is filled with this text',event,this)">READ MORE!</button>
            <button onclick="OpenContent('box 2 is the scond epic box of text',event,this)">READ MORE!</button>
            <button onclick="OpenContent('third box is 3 box its very cool cool',event,this)">READ MORE!</button>
        </div>

        <div id="contentContainer">
                <p id="contentToChange">helloooooo</p>
        </div>

        <script src="JavaScript/openContent.js"></script>
    </body>
    

</html>
